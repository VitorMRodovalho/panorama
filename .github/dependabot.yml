version: 2

# Dependabot watches dependency manifests and opens PRs with fixes.
# Groups reduce PR noise. Security updates bypass groups (they open immediately).

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      nest:
        patterns:
          - "@nestjs/*"
      next:
        patterns:
          - "next"
          - "next-intl"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      types:
        patterns:
          - "@types/*"
        dependency-type: development
      test-tooling:
        patterns:
          - "vitest"
          - "@playwright/*"
          - "playwright"
      # Catch-all, declared last: whatever the named groups above did not
      # claim lands in one minor+patch PR instead of one PR per package.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    ignore:
      # Node majors (@types/node included) follow the LTS line in .nvmrc
      # and `engines`, moved by hand.
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      # init / analyze / upload-sarif must move together, majors included.
      codeql:
        patterns:
          - "github/codeql-action*"
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
      - ci
    commit-message:
      prefix: "chore(ci)"

  # The only Dockerfile is the core-api image.
  - package-ecosystem: docker
    directory: /apps/core-api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels:
      - dependencies
      - automated
      - infra
    commit-message:
      prefix: "chore(infra)"
    ignore:
      # The Node major follows the CI matrix and `engines`, moved by hand.
      - dependency-name: "node"
        update-types:
          - version-update:semver-major

  # compose.dev.yml / compose.prod.yml need the docker-compose ecosystem: a
  # docker entry on this directory fails with "No Dockerfiles nor Kubernetes
  # YAML found in /infra/docker".
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    groups:
      compose-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
      - infra
    commit-message:
      prefix: "chore(infra)"
