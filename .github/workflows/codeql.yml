name: CodeQL

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly run so we pick up newly published queries without a push
    - cron: '23 4 * * 1'

# Default read-only at the workflow level; the analyze job escalates to the
# writes CodeQL needs. Keeps token scope job-local (OSSF Scorecard
# TokenPermissions).
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload analysis results to the Security tab
      actions: read            # required for the `actions` language pack
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
