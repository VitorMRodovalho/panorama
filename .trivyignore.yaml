# .trivyignore.yaml — Panorama supply-chain advisory triage
#
# CONVERTED from plain-text `.trivyignore` on 2026-09-15.
#
# WHY THE CONVERSION: the plain-text format has no expiry support, so the
# `# Expiry: YYYY-MM-DD` headers the old file carried were PROSE — documentation
# of a re-triage obligation that nothing enforced. CVE-2026-4800 stated
# `Expiry: 2026-07-23`, that date passed, and the suppression stayed active and
# silent for ~2 months. In this format `expired_at` is DATA: Trivy stops
# applying the entry on that date and the advisory reappears in the gate.
#
# An exemption whose expiry is prose outlives its justification without anyone
# noticing. That is the failure this file now makes impossible.
#
# Policy: every entry carries `statement` (classification + justification +
# blast radius) and `expired_at`. There is no permanent exemption: an entry that
# still applies after its date must be RE-ARGUED, not renewed by reflex.
#
# Classifications: TRANSITIVE_UNREACHABLE | DIRECT_UNREACHABLE
# PRs adding entries without both fields must be rejected.
#
# Un-dated entries inherited from the 2026-04-23 file are given
# `expired_at: 2026-10-31`, aligned with the #279 freeze-revisit milestone, so
# the quarterly re-triage the old policy only described now actually comes due.

# Re-triage 2026-10-30: every entry below was dropped because the lockfile no
# longer contains a vulnerable version, so each one suppressed nothing.
