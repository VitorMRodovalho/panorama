services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panorama
      POSTGRES_USER: panorama
      POSTGRES_PASSWORD: panorama
      # Panorama app role is created by the init script below;
      # it is intentionally NOT a superuser so RLS is enforced.
    ports:
      - '5432:5432'
    volumes:
      - panorama_pg:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-panorama-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U panorama -d panorama']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - panorama_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (SeaweedFS). Replaced MinIO, whose
  # community images and binaries are no longer published (#293).
  # Dev credentials live in seaweedfs-s3.dev.json and match the
  # S3_ACCESS_KEY / S3_SECRET_KEY defaults in apps/core-api/.env.example.
  # The bucket is created on startup; auto-create on upload is off so a
  # missing bucket fails loudly, as it would on real S3.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=panorama-photos,panorama-backups
      - -s3.autoCreateBucket=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    ports:
      - '9000:9000'
    volumes:
      - panorama_seaweedfs:/data
      - ./seaweedfs-s3.dev.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/healthz']
      interval: 10s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI — http://localhost:8025

volumes:
  panorama_pg:
  panorama_redis:
  panorama_seaweedfs:
